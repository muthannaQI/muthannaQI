<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>حساب عمل البناء – تسجيل الدخول</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: #eef0f2;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    /* ─── Card ─── */
    .card {
      background: #fff;
      border-radius: 12px;
      width: 420px; max-width: 100%;
      padding: 40px 38px 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      animation: fadeUp .4s ease;
    }
    @keyframes fadeUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ─── Header ─── */
    .card-head { text-align: center; margin-bottom: 32px; }
    .card-head h1 {
      font-size: 26px; font-weight: 800;
      color: #2c3e50; margin-bottom: 6px;
    }
    .card-head p { font-size: 14px; color: #888; }

    /* ─── Version badge ─── */
    .version-badge {
      display: inline-block;
      margin-top: 10px;
      background: #e8f8f2;
      color: #1a7a55;
      font-size: 12px; font-weight: 700;
      padding: 4px 14px; border-radius: 20px;
      border: 1px solid #b2dfcf;
      letter-spacing: .4px;
    }

    /* ─── Form ─── */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 14px;
      font-weight: 700; color: #444;
      margin-bottom: 7px; text-align: right;
    }
    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px; font-family: inherit;
      outline: none; background: #fff;
      transition: border .2s, box-shadow .2s;
      text-align: right;
    }
    .form-group input::placeholder { color: #bbb; }
    .form-group input:focus {
      border-color: #2e9e6e;
      box-shadow: 0 0 0 3px rgba(46,158,110,.12);
    }

    /* ─── Error ─── */
    .error-box {
      display: none;
      background: #fff5f5; border: 1px solid #f5c6c6;
      border-right: 4px solid #e74c3c;
      border-radius: 6px; padding: 10px 14px;
      font-size: 13px; color: #c0392b;
      margin-bottom: 18px; font-weight: 600;
    }
    .error-box.show { display: block; animation: shake .3s; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      25%,75%{transform:translateX(-5px)}
      50%{transform:translateX(5px)}
    }

    /* ─── Button ─── */
    .btn-login {
      width: 100%; padding: 14px;
      background: #2e9e6e; color: #fff;
      border: none; border-radius: 8px;
      font-size: 16px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: background .15s, transform .1s;
      margin-top: 4px; letter-spacing: .3px;
    }
    .btn-login:hover  { background: #267d58; }
    .btn-login:active { transform: scale(.99); }

    /* ─── Divider ─── */
    .divider {
      height: 1px; background: #eee;
      margin: 22px 0;
    }

    /* ─── Forgot ─── */
    .forgot-wrap { text-align: center; }
    .forgot {
      color: #e67e22; font-size: 13px; font-weight: 600;
      text-decoration: none;
    }
    .forgot:hover { text-decoration: underline; }

    /* ─── Footer version ─── */
    .card-foot {
      text-align: center; margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #f0f0f0;
      font-size: 11px; color: #bbb;
    }
    .card-foot .ver { color: #2e9e6e; font-weight: 700; }
  </style>
</head>
<body>

<div class="card">

  <!-- Head -->
  <div class="card-head">
    <h1>🔒 حساب عمل البناء</h1>
    <p>أدخل بيانات الدخول للمتابعة</p>
    <div class="version-badge" id="versionBadge">🔖 إصدار v2.0</div>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox">اسم المستخدم أو كلمة المرور غير صحيحة</div>

  <!-- Form -->
  <form onsubmit="handleLogin(event)" autocomplete="on">
    <div class="form-group">
      <label>اسم المستخدم</label>
      <input type="text" id="loginUser" placeholder="اسم المستخدم"
             autocomplete="username" required/>
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="loginPass" placeholder="••••••••"
             autocomplete="current-password" required/>
    </div>
    <button type="submit" class="btn-login">دخول</button>
  </form>

  <div class="divider"></div>

  <div class="forgot-wrap">
    <a href="#" class="forgot">🗝️ نسيت كلمة المرور؟</a>
  </div>

  <div class="card-foot">
    نظام الكيل والدفعات &copy; 2025
    &nbsp;|&nbsp;
    <span class="ver" id="footerVer">v2.0</span>
  </div>
</div>

<script>
/* ══════════════════════════════════
   CONSTANTS & VERSION
══════════════════════════════════ */
const APP_VERSION = '2.0';
const VERSION_KEY = 'plantaslb_version';
const STORE_KEY   = 'plantaslb_users';
const SESSION_KEY = 'plantaslb_session';
const LOG_KEY     = 'plantaslb_log';

/* ─── تنظيف تلقائي عند تغيّر الإصدار ─── */
if (localStorage.getItem(VERSION_KEY) !== APP_VERSION) {
  localStorage.clear();
  localStorage.setItem(VERSION_KEY, APP_VERSION);
}

/* ─── عرض رقم الإصدار ─── */
document.getElementById('versionBadge').textContent = '🔖 إصدار v' + APP_VERSION;
document.getElementById('footerVer').textContent    = 'v' + APP_VERSION;

/* ══════════════════════════════════
   SEED DEFAULT USERS
══════════════════════════════════ */
(function seed() {
  if (localStorage.getItem(STORE_KEY)) return;
  localStorage.setItem(STORE_KEY, JSON.stringify([
    {
      id: 1,
      name: 'مدير النظام',
      username: 'admin',
      email: 'admin@plantaslb.com',
      password: 'admin123',
      phone: '0500000001',
      role: 'admin',
      status: 'active',
      perms: ['view_data','add_work','add_payment','edit_data','delete_data','manage_users','view_reports','export_data'],
      createdAt: new Date().toLocaleDateString('ar-SA')
    },
    {
      id: 2,
      name: 'موظف تجريبي',
      username: 'staff',
      email: 'staff@plantaslb.com',
      password: 'staff123',
      phone: '0500000002',
      role: 'employee',
      status: 'active',
      perms: ['view_data','add_work','add_payment','view_reports'],
      createdAt: new Date().toLocaleDateString('ar-SA')
    }
  ]));
})();

/* ══════════════════════════════════
   LOGIN HANDLER
   يدعم الدخول بـ: اسم المستخدم أو البريد
══════════════════════════════════ */
function handleLogin(e) {
  e.preventDefault();
  const input = document.getElementById('loginUser').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const users = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');

  /* البحث بـ username أو email */
  const user = users.find(u =>
    (u.username && u.username.toLowerCase() === input.toLowerCase()) ||
    (u.email    && u.email.toLowerCase()    === input.toLowerCase())
  );

  const errBox = document.getElementById('errorBox');

  if (!user || user.password !== pass) {
    errBox.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    errBox.classList.add('show');
    setTimeout(() => errBox.classList.remove('show'), 3500);
    return;
  }
  if (user.status === 'inactive') {
    errBox.textContent = 'هذا الحساب معطّل – تواصل مع المسؤول';
    errBox.classList.add('show');
    return;
  }

  /* حفظ الجلسة */
  const session = {
    id:       user.id,
    name:     user.name,
    username: user.username,
    email:    user.email,
    role:     user.role,
    perms:    user.perms
  };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));

  addLog('login', user.name, `دخول – ${roleLabel(user.role)}`);
  window.location.href = 'users.html';
}

function roleLabel(r) {
  return { admin:'مدير', employee:'موظف', viewer:'مشاهد' }[r] || r;
}

function addLog(action, actor, detail) {
  const logs = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
  logs.unshift({ id: Date.now(), action, actor, detail, time: new Date().toLocaleString('ar-SA') });
  localStorage.setItem(LOG_KEY, JSON.stringify(logs.slice(0, 200)));
}

/* ─── إذا كانت الجلسة قائمة ─── */
const _s = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
if (_s) window.location.href = 'users.html';
</script>
</body>
</html>
