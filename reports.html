<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>التقارير وسجل النشاط</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
    }

    /* ─── Header ─── */
    header {
      background: linear-gradient(135deg, #1a5276, #2e86c1);
      color: #fff;
      padding: 0 32px;
      display: flex;
      align-items: center;
      height: 64px;
      gap: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.2);
    }
    header .logo { font-size: 26px; }
    header h1 { font-size: 18px; font-weight: 700; flex: 1; }

    /* ─── Nav links ─── */
    .nav-links { display: flex; gap: 4px; }
    .nav-links a {
      color: rgba(255,255,255,.75);
      text-decoration: none;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 8px;
      transition: background .15s, color .15s;
      font-weight: 600;
    }
    .nav-links a:hover, .nav-links a.active { background: rgba(255,255,255,.18); color: #fff; }
    .nav-links a.logout { color: #fca5a5; }
    .nav-links a.logout:hover { background: rgba(239,68,68,.25); color: #fff; }

    /* ─── Container ─── */
    .container { max-width: 1140px; margin: 30px auto; padding: 0 20px; }

    /* ─── Section title ─── */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a5276;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ─── Stats Grid ─── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: #fff;
      border-radius: 14px;
      padding: 22px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      border-right: 5px solid #2e86c1;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .stat-card.logins    { border-right-color: #27ae60; }
    .stat-card.adds      { border-right-color: #2e86c1; }
    .stat-card.edits     { border-right-color: #f39c12; }
    .stat-card.deletes   { border-right-color: #e74c3c; }
    .stat-card.active    { border-right-color: #8e44ad; }

    .stat-icon { font-size: 28px; }
    .stat-info .num   { font-size: 28px; font-weight: 800; color: #1a5276; }
    .stat-info .label { font-size: 12px; color: #718096; margin-top: 2px; }

    /* ─── Charts row ─── */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (max-width:700px) { .charts-row { grid-template-columns: 1fr; } }

    .chart-card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }
    .chart-card h3 { font-size: 14px; color: #4a5568; margin-bottom: 18px; font-weight: 700; }

    /* ─── Bar chart ─── */
    .bar-chart { display: flex; flex-direction: column; gap: 12px; }
    .bar-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .bar-label { width: 80px; text-align: right; color: #4a5568; font-size: 12px; white-space: nowrap; }
    .bar-track { flex: 1; height: 20px; background: #f0f4f8; border-radius: 10px; overflow: hidden; }
    .bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width .8s cubic-bezier(.34,1.56,.64,1);
      min-width: 2px;
    }
    .bar-val { width: 28px; text-align: left; font-weight: 700; color: #2d3748; font-size: 12px; }

    /* ─── Donut chart (CSS) ─── */
    .donut-wrap { display: flex; align-items: center; gap: 24px; justify-content: center; }
    .donut {
      width: 130px; height: 130px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }
    .donut-legend { display: flex; flex-direction: column; gap: 10px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ─── Toolbar ─── */
    .log-toolbar {
      display: flex; gap: 10px; flex-wrap: wrap;
      align-items: center; margin-bottom: 16px;
    }
    .log-toolbar input, .log-toolbar select {
      padding: 9px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      background: #fff;
      transition: border .2s;
    }
    .log-toolbar input:focus, .log-toolbar select:focus { border-color: #2e86c1; }
    .log-toolbar input { flex: 1; min-width: 180px; }

    .btn {
      padding: 9px 18px;
      border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: .15s;
    }
    .btn-outline {
      background: #fff;
      border: 2px solid #e2e8f0;
      color: #4a5568;
    }
    .btn-outline:hover { border-color: #2e86c1; color: #2e86c1; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-danger:hover { background: #c0392b; }

    /* ─── Log table ─── */
    .table-wrap {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: linear-gradient(135deg, #1a5276, #2e86c1); color: #fff; }
    thead th { padding: 13px 16px; text-align: right; font-size: 13px; font-weight: 600; }
    tbody tr { border-bottom: 1px solid #f0f4f8; transition: background .12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #ebf5fb; }
    tbody td { padding: 12px 16px; font-size: 13px; vertical-align: middle; }

    /* ─── Action badges ─── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .badge-login  { background: #e9f7ef; color: #1e8449; }
    .badge-add    { background: #ebf5fb; color: #1a5276; }
    .badge-edit   { background: #fef9e7; color: #b7770d; }
    .badge-delete { background: #fde8e8; color: #c0392b; }
    .badge-logout { background: #f0f0f0; color: #555; }

    /* ─── Pagination ─── */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 6px; padding: 16px;
    }
    .page-btn {
      width: 34px; height: 34px;
      border: 2px solid #e2e8f0;
      background: #fff;
      border-radius: 8px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: .15s;
      font-family: inherit;
      color: #4a5568;
    }
    .page-btn:hover   { border-color: #2e86c1; color: #2e86c1; }
    .page-btn.active  { background: #2e86c1; border-color: #2e86c1; color: #fff; }
    .page-btn:disabled { opacity: .4; cursor: default; }

    /* ─── Empty ─── */
    .empty { text-align: center; padding: 50px; color: #a0aec0; }
    .empty .icon { font-size: 46px; margin-bottom: 10px; }

    /* ─── Toast ─── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a5276; color: #fff;
      padding: 11px 26px; border-radius: 30px;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      z-index: 9999;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- ══════ HEADER ══════ -->
<header>
  <div class="logo">🌿</div>
  <h1>التقارير وسجل النشاط</h1>
  <nav class="nav-links">
    <a href="users.html">👥 المستخدمون</a>
    <a href="reports.html" class="active">📊 التقارير</a>
    <a href="#" class="logout" onclick="logout()">🚪 خروج</a>
  </nav>
</header>

<div class="container">

  <!-- ── Stats ── -->
  <div class="section-title">📊 ملخص النشاط</div>
  <div class="stats-grid">
    <div class="stat-card logins">
      <div class="stat-icon">🔐</div>
      <div class="stat-info">
        <div class="num" id="loginCount">0</div>
        <div class="label">عمليات الدخول</div>
      </div>
    </div>
    <div class="stat-card adds">
      <div class="stat-icon">➕</div>
      <div class="stat-info">
        <div class="num" id="addCount">0</div>
        <div class="label">مستخدمون جُدد</div>
      </div>
    </div>
    <div class="stat-card edits">
      <div class="stat-icon">✏️</div>
      <div class="stat-info">
        <div class="num" id="editCount">0</div>
        <div class="label">تعديلات</div>
      </div>
    </div>
    <div class="stat-card deletes">
      <div class="stat-icon">🗑️</div>
      <div class="stat-info">
        <div class="num" id="deleteCount">0</div>
        <div class="label">عمليات حذف</div>
      </div>
    </div>
    <div class="stat-card active">
      <div class="stat-icon">👥</div>
      <div class="stat-info">
        <div class="num" id="activeUsers">0</div>
        <div class="label">مستخدمون نشطون</div>
      </div>
    </div>
  </div>

  <!-- ── Charts ── -->
  <div class="charts-row">

    <!-- Roles bar chart -->
    <div class="chart-card">
      <h3>📈 توزيع المستخدمين حسب الدور</h3>
      <div class="bar-chart" id="rolesChart"></div>
    </div>

    <!-- Permissions donut -->
    <div class="chart-card">
      <h3>🔐 توزيع الصلاحيات الأكثر استخداماً</h3>
      <div id="permsChartWrap"></div>
    </div>

  </div>

  <!-- ── Activity Log ── -->
  <div class="section-title">🕒 سجل النشاط التفصيلي</div>

  <div class="log-toolbar">
    <input type="text" id="logSearch" placeholder="🔍 بحث بالاسم أو التفاصيل…" oninput="renderLog()">
    <select id="filterAction" onchange="renderLog()">
      <option value="">جميع الأنشطة</option>
      <option value="login">🔐 دخول</option>
      <option value="add">➕ إضافة</option>
      <option value="edit">✏️ تعديل</option>
      <option value="delete">🗑️ حذف</option>
      <option value="logout">🚪 خروج</option>
    </select>
    <button class="btn btn-outline" onclick="exportCSV()">📥 تصدير CSV</button>
    <button class="btn btn-danger" onclick="clearLogs()">🗑️ مسح السجل</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>المستخدم</th>
          <th>النشاط</th>
          <th>التفاصيل</th>
          <th>التوقيت</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
    <div class="pagination" id="pagination"></div>
  </div>

</div>

<div id="toast"></div>

<script>
const STORE_KEY   = 'plantaslb_users';
const SESSION_KEY = 'plantaslb_session';
const LOG_KEY     = 'plantaslb_log';

/* ─── Auth check ─── */
const session = JSON.parse(localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY) || 'null');
if (!session) window.location.href = 'login.html';

/* ─── Helpers ─── */
function getLogs()  { try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch { return []; } }
function getUsers() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch { return []; } }

/* ─── Update Stats ─── */
function updateStats() {
  const logs  = getLogs();
  const users = getUsers();

  document.getElementById('loginCount').textContent  = logs.filter(l => l.action === 'login').length;
  document.getElementById('addCount').textContent    = logs.filter(l => l.action === 'add').length;
  document.getElementById('editCount').textContent   = logs.filter(l => l.action === 'edit').length;
  document.getElementById('deleteCount').textContent = logs.filter(l => l.action === 'delete').length;
  document.getElementById('activeUsers').textContent = users.filter(u => u.status === 'active').length;
}

/* ─── Roles Bar Chart ─── */
function renderRolesChart() {
  const users = getUsers();
  const counts = {
    'مسؤول':  { count: users.filter(u => u.role === 'admin').length,  color: '#e74c3c' },
    'محرّر':   { count: users.filter(u => u.role === 'editor').length, color: '#f39c12' },
    'مشاهد':  { count: users.filter(u => u.role === 'viewer').length,  color: '#27ae60' },
  };
  const max = Math.max(...Object.values(counts).map(v => v.count), 1);
  const html = Object.entries(counts).map(([label, {count, color}]) => `
    <div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(count/max*100).toFixed(1)}%; background:${color}"></div>
      </div>
      <div class="bar-val">${count}</div>
    </div>
  `).join('');
  document.getElementById('rolesChart').innerHTML = html;
}

/* ─── Permissions Chart ─── */
function renderPermsChart() {
  const users = getUsers();
  const permCounts = {};
  const permLabels = {
    view_certificates:  'عرض الشهادات',
    issue_certificates: 'إصدار الشهادات',
    edit_data:          'تعديل البيانات',
    manage_users:       'إدارة المستخدمين',
    view_reports:       'عرض التقارير',
    export_data:        'تصدير البيانات'
  };
  users.forEach(u => (u.perms || []).forEach(p => { permCounts[p] = (permCounts[p] || 0) + 1; }));

  const colors = ['#2e86c1','#27ae60','#f39c12','#e74c3c','#8e44ad','#16a085'];
  const total  = Object.values(permCounts).reduce((a,b) => a+b, 0) || 1;
  const sorted = Object.entries(permCounts).sort((a,b) => b[1]-a[1]);

  if (!sorted.length) {
    document.getElementById('permsChartWrap').innerHTML = '<p style="text-align:center;color:#a0aec0;padding:30px">لا توجد بيانات</p>';
    return;
  }

  /* Build conic-gradient for donut */
  let deg = 0;
  const segments = sorted.map(([p, count], i) => {
    const pct   = (count / total) * 360;
    const color = colors[i % colors.length];
    const seg   = `${color} ${deg}deg ${deg + pct}deg`;
    deg += pct;
    return { p, count, color, seg };
  });
  const gradient = segments.map(s => s.seg).join(', ');

  const legendHtml = segments.slice(0, 6).map(s => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${s.color}"></div>
      <span>${permLabels[s.p] || s.p} <strong>(${s.count})</strong></span>
    </div>
  `).join('');

  document.getElementById('permsChartWrap').innerHTML = `
    <div class="donut-wrap">
      <div class="donut" style="background: conic-gradient(${gradient}); box-shadow: 0 4px 18px rgba(0,0,0,.12)">
        <div style="
          position:absolute; inset:20px;
          background:#fff; border-radius:50%;
          display:flex; align-items:center; justify-content:center;
          flex-direction:column; font-size:11px; color:#718096; font-weight:600; text-align:center;
        ">
          <div style="font-size:20px;font-weight:800;color:#1a5276">${users.length}</div>
          مستخدم
        </div>
      </div>
      <div class="donut-legend">${legendHtml}</div>
    </div>
  `;
}

/* ─── Pagination ─── */
let currentPage = 1;
const PAGE_SIZE = 10;

function renderLog() {
  currentPage = 1;
  renderPage();
}

function renderPage() {
  const q      = document.getElementById('logSearch').value.trim().toLowerCase();
  const filter = document.getElementById('filterAction').value;

  let logs = getLogs().filter(l => {
    const matchQ = !q || l.actor.toLowerCase().includes(q) || l.detail.toLowerCase().includes(q);
    const matchF = !filter || l.action === filter;
    return matchQ && matchF;
  });

  const totalPages = Math.ceil(logs.length / PAGE_SIZE) || 1;
  currentPage = Math.min(currentPage, totalPages);
  const slice = logs.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

  const actionBadge = {
    login:  '<span class="badge badge-login">🔐 دخول</span>',
    add:    '<span class="badge badge-add">➕ إضافة</span>',
    edit:   '<span class="badge badge-edit">✏️ تعديل</span>',
    delete: '<span class="badge badge-delete">🗑️ حذف</span>',
    logout: '<span class="badge badge-logout">🚪 خروج</span>',
  };

  const tbody = document.getElementById('logBody');
  if (!slice.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty"><div class="icon">📋</div><p>لا يوجد نشاط مسجّل</p></td></tr>`;
  } else {
    tbody.innerHTML = slice.map((l, i) => `
      <tr>
        <td style="color:#a0aec0">${(currentPage-1)*PAGE_SIZE + i + 1}</td>
        <td><strong>${l.actor}</strong></td>
        <td>${actionBadge[l.action] || `<span class="badge" style="background:#f0f0f0;color:#555">${l.action}</span>`}</td>
        <td style="color:#4a5568">${l.detail}</td>
        <td style="color:#718096;font-size:12px;white-space:nowrap">${l.time}</td>
      </tr>
    `).join('');
  }

  /* Pagination buttons */
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  let btns = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  for (let p = 1; p <= totalPages; p++) {
    if (totalPages > 7 && p > 2 && p < totalPages-1 && Math.abs(p-currentPage) > 1) {
      if (p === 3 || p === totalPages-2) btns += `<span style="padding:0 4px;color:#a0aec0">…</span>`;
      continue;
    }
    btns += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  }
  btns += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
  pag.innerHTML = btns;
}

function goPage(p) { currentPage = p; renderPage(); }

/* ─── Export CSV ─── */
function exportCSV() {
  const logs = getLogs();
  if (!logs.length) { showToast('⚠️ لا يوجد سجل لتصديره'); return; }
  const header = 'المستخدم,النشاط,التفاصيل,التوقيت\n';
  const rows   = logs.map(l => `"${l.actor}","${l.action}","${l.detail}","${l.time}"`).join('\n');
  const blob   = new Blob(['﻿' + header + rows], { type: 'text/csv;charset=utf-8;' });
  const url    = URL.createObjectURL(blob);
  const a      = document.createElement('a');
  a.href = url; a.download = `activity_log_${Date.now()}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast('📥 تم تصدير السجل بنجاح');
}

/* ─── Clear Logs ─── */
function clearLogs() {
  if (!confirm('هل أنت متأكد من مسح كامل سجل النشاط؟')) return;
  localStorage.removeItem(LOG_KEY);
  updateStats(); renderRolesChart(); renderPermsChart(); renderLog();
  showToast('🗑️ تم مسح السجل');
}

/* ─── Logout ─── */
function logout() {
  addLog('logout', session.name, 'تسجيل خروج');
  localStorage.removeItem(SESSION_KEY);
  sessionStorage.removeItem(SESSION_KEY);
  window.location.href = 'login.html';
}

function addLog(action, actor, detail) {
  const logs = getLogs();
  logs.unshift({ id: Date.now(), action, actor, detail, time: new Date().toLocaleString('ar-SA') });
  localStorage.setItem(LOG_KEY, JSON.stringify(logs.slice(0, 200)));
}

/* ─── Toast ─── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

/* ─── Init ─── */
updateStats();
renderRolesChart();
renderPermsChart();
renderLog();
</script>
</body>
</html>
